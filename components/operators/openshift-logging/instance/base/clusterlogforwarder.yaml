apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: collector
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  managementState: Managed
  collector:
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
  filters:
    - name: detectexception
      type: detectMultilineException
    - name: parse-json
      type: parse
  outputs:
    - name: default-lokistack
      type: lokiStack
      lokiStack:
        target:
          name: logging-loki
          namespace: openshift-loki-operator
        authentication:
          token:
            from: serviceAccount
      tls:
        ca:
          key: service-ca.crt
          configMapName: openshift-service-ca.crt
  pipelines:
    - name: default-lokistack
      inputRefs:
        - application
        - infrastructure
        - audit
      filterRefs:
        - detectexception
        - parse-json
      outputRefs:
        - default-lokistack
  serviceAccount:
    name: logging-collector
